<!DOCTYPE html>
<html>
<head>
    <title>Salary Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Salary Prediction</h1>

    <input
        type="number"
        id="years"
        placeholder="Enter years of experience"
    >

    <button onclick="predictSalary()">
        Predict
    </button>

    <div id="result"></div>

    <script>
        async function predictSalary() {
            const years = document.getElementById("years").value;

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            age: Number(years)
                        })
                    }
                );

                const data = await response.json();

                document.getElementById("result").innerHTML =
                    "Predicted Salary: ₹" +
                    data.prediction.toLocaleString();

            } catch (error) {
                document.getElementById("result").innerHTML =
                    "Error connecting to API";
                console.error(error);
            }
        }
    </script>

</body>
</html>
